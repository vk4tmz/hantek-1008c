[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hantek-1008c"
version = "0.1.0"
description = "Linux USB protocol research and tooling for the Hantek 1008C oscilloscope"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3.1"]

[tool.setuptools.packages.find]
include = ["hantek1008c*"]
